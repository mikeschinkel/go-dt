[[item]]
id = "P1"
kind = "deliverable"
statement = "Each EntryStatus constant has an explicit value equal to its current iota value, IsInvalidEntryStatus 0 through IsUnclassifiedEntryStatus 9"
verify = "Read the EntryStatus const block in entry_status.go"

[[item]]
id = "P2"
kind = "deliverable"
statement = "DontFollowSymlinks is declared as 1 << 0"
verify = "Read the EntryStatusFlags const block in entry_path_ext.go"

[[item]]
id = "P3"
kind = "deliverable"
statement = "No Go file in the go-dt repository, in any module, uses iota"
verify = "grep -rn iota --include='*.go' from the repo root prints nothing"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A test in go-dt's test/ module pins every EntryStatus constant and DontFollowSymlinks to its numeric value"
verify = "cd test && go test ./..."

[[item]]
id = "P5"
kind = "deliverable"
statement = "The IsUnclassifiedEntryStatus doc comment no longer names symlinks, sockets, devices or pipes as unclassified"

[[item]]
id = "P6"
kind = "deliverable"
statement = "IsSymlinkEntry, IsSocketEntry, IsPipeEntry and IsDeviceEntry each have a doc comment"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not change the name or numeric value of any constant"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not change the behaviour of EntryStatus.String, GetEntryStatus or any Status method"

[[item]]
id = "P9"
kind = "deliverable"
statement = "No doc comment in go-dt names the nonexistent FlagDontFollowSymlinks; the five Status doc comments that did now name DontFollowSymlinks"
verify = "git grep FlagDontFollowSymlinks -- '*.go' prints nothing"
