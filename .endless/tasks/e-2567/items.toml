# Plan items for E-2567: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2567 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "go-dt exports IPv4Address, IPv6Address and IPAddress with ParseIPv4Address, ParseIPv6Address and ParseIPAddress, storing net/netip's canonical text"
verify = "ParseIPv6Address(\"2001:DB8::0:1\") returns \"2001:db8::1\""

[[item]]
id = "P2"
kind = "deliverable"
statement = "The IP Parse functions reject IPv6 zones such as fe80::1%en0, and an IPv4-mapped address parses as IPv6Address"

[[item]]
id = "P3"
kind = "deliverable"
statement = "go-dt exports HostDomainName and SingleLabelHostname with Parse functions implementing RFC 1034's preferred name syntax as amended by RFC 1123 (digit-first labels allowed, final label not all-numeric, no trailing dot)"

[[item]]
id = "P4"
kind = "deliverable"
statement = "ParseInternetDomain requires two or more labels and rejects names under test, localhost, invalid, local and home.arpa, while accepting example.com"

[[item]]
id = "P5"
kind = "deliverable"
statement = "ParseInternetDomainArgs has PublicSuffixClassifier, IDNAConverter, RejectedSuffixes and AcceptedSuffixes fields, the suffix lists typed []HostDomainName, and a nil args value means syntax plus the built-in special-use list"

[[item]]
id = "P6"
kind = "deliverable"
statement = "With a PublicSuffixClassifier set, ParseInternetDomain rejects a name under an unlisted suffix (foo.cromulent) and a name that is itself a public suffix (co.uk, github.io)"

[[item]]
id = "P7"
kind = "deliverable"
statement = "go-dt exports Hostname with ParseHostname, accepting any IPAddress or HostDomainName, and accessors IPAddress, HostDomainName, SingleLabelHostname and InternetDomain that each return the narrower type and a bool"

[[item]]
id = "P8"
kind = "deliverable"
statement = "NewHostname and NewIPAddress are generic over a union of their member types, so passing a plain string does not compile"

[[item]]
id = "P9"
kind = "deliverable"
statement = "go-dt exports DNSName with ParseDNSName, accepting underscored labels such as _dmarc.example.com and keeping a trailing root dot"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Hostname.ToDNSName and DNSName.ToHostname convert sideways and return an error when the value has no counterpart"

[[item]]
id = "P11"
kind = "deliverable"
statement = "go-dt exports PublicSuffixKind with explicit constant values (Unspecified 0, Unlisted 1, ICANN 2, Private 3), the PublicSuffixClassifier interface and ClassifyPublicSuffixFunc, whose domain and suffix are HostDomainName"

[[item]]
id = "P12"
kind = "deliverable"
statement = "go-dt exports the ASCIIToer interface and ToASCIIFunc, and ParseInternetDomain, ParseHostname, ParseEmailAddress and ParseMailbox accept one through their args to convert Unicode names to A-labels"

[[item]]
id = "P13"
kind = "deliverable"
statement = "Without an ASCIIToer, the host and email Parse functions reject a Unicode host name"

[[item]]
id = "P15"
kind = "deliverable"
statement = "go-dt exports EmailLocalPart and EmailAddress with ParseEmailAddress, where the part after the @ is a Hostname and a quoted local part keeps its quotes"
verify = "ParseEmailAddress(`\"john doe\"@example.com`) round-trips unchanged"

[[item]]
id = "P16"
kind = "deliverable"
statement = "EmailAddress text brackets an IP host (user@[192.0.2.1], user@[IPv6:2001:db8::1]), a bare IP after the @ is accepted and stored bracketed, and a general address literal is rejected"

[[item]]
id = "P17"
kind = "deliverable"
statement = "EmailAddress.LocalPart returns EmailLocalPart and EmailAddress.Hostname returns the Hostname with brackets and the IPv6: tag removed"

[[item]]
id = "P18"
kind = "deliverable"
statement = "EmailAddress.Equals compares with the host folded to lower case and the local part exact"

[[item]]
id = "P19"
kind = "deliverable"
statement = "ParseEmailAddress and ParseMailbox reject a UTF-8 local part with a dedicated sentinel unless AllowSMTPUTF8 is set in their args"

[[item]]
id = "P20"
kind = "deliverable"
statement = "EmailAddress.RequiresSMTPUTF8 reports whether the address contains non-ASCII text"

[[item]]
id = "P21"
kind = "deliverable"
statement = "go-dt exports EmailDisplayName with ParseEmailDisplayName, rejecting angle brackets, carriage returns and line feeds"

[[item]]
id = "P22"
kind = "deliverable"
statement = "go-dt exports Mailbox as a struct with fields DisplayName EmailDisplayName and Email EmailAddress, and no NewMailbox"

[[item]]
id = "P23"
kind = "deliverable"
statement = "ParseMailbox accepts \"Name <address>\", \"<address>\" and a bare address, leaving DisplayName empty for the last two"

[[item]]
id = "P24"
kind = "deliverable"
statement = "Mailbox.String renders \"DisplayName <address>\" unquoted, and \"<address>\" when DisplayName is empty"

[[item]]
id = "P25"
kind = "deliverable"
statement = "Mailbox.Validate and EmailAddress.Validate take no arguments, accept UTF-8, and return the same errors the Parse functions would for invalid parts"

[[item]]
id = "P26"
kind = "deliverable"
statement = "MakeEmailAddress and MakeMailbox ship commented out, with a comment inviting a pull request that justifies enabling them"

[[item]]
id = "P27"
kind = "deliverable"
statement = "go-dt declares ScopedIPv6Address, HostPort, PortNumber and ServiceName, whose Parse functions return ErrNotYetSupported"

[[item]]
id = "P28"
kind = "deliverable"
statement = "HostPort declares a generic Port[T PortNumber | ServiceName]() method and typed PortNumber() and ServiceName() methods"

[[item]]
id = "P29"
kind = "deliverable"
statement = "The deferred types' doc comments record the options weighed and the use cases that would decide them"

[[item]]
id = "P30"
kind = "deliverable"
statement = "Each new type has an ErrInvalid sentinel in errors.go and an ErrKV method, following the path types"

[[item]]
id = "P31"
kind = "deliverable"
statement = "Input that an RFC allows but a type deliberately rejects fails with an unsupported sentinel whose message points to the type's doc comment"

[[item]]
id = "P32"
kind = "deliverable"
statement = "Every exported symbol added by this task has a doc comment naming the RFC term or standard library precedent behind its name"

[[item]]
id = "P33"
kind = "deliverable"
statement = "Each new type's doc comment lists what it rejects and why, and says to define your own type or open a GitHub issue to propose one"

[[item]]
id = "P34"
kind = "deliverable"
statement = "go-dt's test/ module covers every Parse function, accessor and conversion added by this task"
verify = "cd test && go test ./..."

[[item]]
id = "P35"
kind = "deliverable"
statement = "README's domain-type section describes the new types, and its InternetDomain entry lists only methods the code has"

[[item]]
id = "P36"
kind = "deliverable"
statement = "go-dt's AGENTS.md says tests live in test/ modules, matching ED-1650"

[[item]]
id = "P37"
kind = "exclusion"
statement = "go-dt's root go.mod gains no external module requirement; only dtx requires golang.org/x/net"

[[item]]
id = "P38"
kind = "exclusion"
statement = "Does not rename or remove any existing exported go-dt symbol, and InternetDomain keeps its documented meaning"

[[item]]
id = "P39"
kind = "exclusion"
statement = "Does not implement ScopedIPv6Address, HostPort, PortNumber or ServiceName beyond their declarations"

[[item]]
id = "P40"
kind = "exclusion"
statement = "Does not add a Hostname method to dt.URL or change any existing type to use the new ones"

[[item]]
id = "P41"
kind = "exclusion"
statement = "Does not replace iota in EntryStatus; a separate task does"

[[item]]
id = "P42"
kind = "deliverable"
statement = "dtx's ClassifyPublicSuffix and ToASCII move to a follow-up task, because dtx requires a published go-dt and cannot see the new types until root is tagged"
