# Verification suite for E-2549 — add dt.StdIO for injectable standard streams.
# DO NOT EDIT unless you ARE E-2549. See .endless/tasks/CLAUDE.md.
#
# Every check sees go-dt as CI and a consumer do: without a go.work. The sh
# checks say GOWORK=off; a gotest check cannot set it, so the first check
# proves no go.work reaches the root or test module, which is the same thing.
schema = 1
task   = "E-2549"

[[check]]
name   = "no go.work reaches the root or test module, so the gotest checks run as GOWORK=off"
sh     = "for d in . test; do (cd $d && go env GOWORK); done | grep -v '^off$' || true"
equals = ""

[[check]]
name   = "StdIO unit tests in the test module"
runner = "gotest"
dir    = "test"
tests  = ["TestNewStdIO", "TestNewStdIOStreamsAreUsable", "TestNewDefaultStdIO"]
paths  = ["."]

[[check]]
name   = "root module tests"
runner = "gotest"
paths  = ["./..."]

[[check]]
name   = "test module tests"
runner = "gotest"
dir    = "test"
paths  = ["./..."]

[[check]]
name = "P1: go build ./... and go vet ./... pass in go-dt with GOWORK=off"
sh   = "GOWORK=off go build -o /dev/null ./... && GOWORK=off go vet ./..."

[[check]]
name = "P3: the StdIO test lives in the test module, not beside the code (ED-1650)"
sh   = "test -f test/stdio_test.go && test ! -e stdio_test.go"

[[check]]
name     = "P1: dt.StdIO is an interface with Output(), ErrOut() and Input()"
sh       = "GOWORK=off go doc . StdIO"
contains = "type StdIO interface {\n\tOutput() io.Writer\n\tErrOut() io.Writer\n\tInput() io.Reader\n}"

[[check]]
name     = "P1: dt.NewStdIO(out, err, in...) constructs a StdIO"
sh       = "GOWORK=off go doc -short . NewStdIO"
contains = "func NewStdIO(out io.Writer, err io.Writer, in ...io.Reader) StdIO"

[[check]]
name     = "P1: dt.NewDefaultStdIO() constructs a StdIO"
sh       = "GOWORK=off go doc -short . NewDefaultStdIO"
contains = "func NewDefaultStdIO() StdIO"

[[check]]
name   = "P2: this branch touches only stdio.go, its test in test/ and this suite"
sh     = "git diff --name-only main...HEAD -- . ':(exclude).endless/db-ledger' ':(exclude).endless/verbs.jsonl' ':(exclude).endless/tasks/e-2549/*.md' ':(exclude).endless/tasks/e-2549/items.toml'"
equals = ".endless/tasks/e-2549/verify.toml\nstdio.go\ntest/stdio_test.go"

[[check]]
name   = "P2: no consumer in go-dt's own nested modules references StdIO yet"
sh     = "git grep -l 'StdIO' -- dtx appinfo dtglob examples || true"
equals = ""
