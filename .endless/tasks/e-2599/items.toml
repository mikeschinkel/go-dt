# Plan items for E-2599: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2599 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "go-dt's root package exports GitRef, GitBranchName, GitTagName, GitRemoteName, GitRevision, GitObjectID and GitShortObjectID, each a string type"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Each type has ParseGit<Type>(string) returning the type and an error, and a Validate() error method that applies the same rules"
detail = "ParseGitObjectID and ParseGitShortObjectID also take a pointer to an args struct; nil means defaults"

[[item]]
id = "P3"
kind = "deliverable"
statement = "GitRef accepts only names under refs/ that pass git's check-ref-format rules; HEAD, FETCH_HEAD, ORIG_HEAD and MERGE_HEAD are rejected"
verify = "test/ module table: valid and invalid refnames, one per rule"

[[item]]
id = "P4"
kind = "deliverable"
statement = "GitBranchName accepts a name exactly when refs/heads/<name> is a valid GitRef, the name does not begin with '-' and is not HEAD"
verify = "test/ module table matching git check-ref-format --branch on git 2.52"

[[item]]
id = "P5"
kind = "deliverable"
statement = "GitTagName accepts a name exactly when refs/tags/<name> is a valid GitRef, the name does not begin with '-' and is not HEAD"

[[item]]
id = "P6"
kind = "deliverable"
statement = "GitRemoteName accepts a name exactly when refs/remotes/<name>/test is a valid GitRef"

[[item]]
id = "P7"
kind = "deliverable"
statement = "GitRevision rejects an empty value, NUL and other control characters, leading or trailing whitespace, and a leading '-'; it accepts anything else"
verify = "test/ module: HEAD~1, main^{tree}, v1:path, @{upstream} and ':/fix bug' parse; '-x', '' and 'a\\x00b' fail"

[[item]]
id = "P8"
kind = "deliverable"
statement = "GitObjectID accepts exactly 40 or 64 hex digits"

[[item]]
id = "P9"
kind = "deliverable"
statement = "GitShortObjectID accepts 4 to 64 hex digits"

[[item]]
id = "P10"
kind = "deliverable"
statement = "ParseGitObjectID and ParseGitShortObjectID reject uppercase hex unless AllowUppercaseHex is set, and then store the value in lowercase"
verify = "test/ module: an uppercase ID fails by default; with AllowUppercaseHex it parses, equals the lowercase ID with ==, and passes Validate()"

[[item]]
id = "P11"
kind = "deliverable"
statement = "GitBranchName.ToRef() and GitTagName.ToRef() return the full GitRef (refs/heads/<name>, refs/tags/<name>) and never fail"

[[item]]
id = "P12"
kind = "deliverable"
statement = "GitRef.ToBranchName() and GitRef.ToTagName() return the short name, or an error when the ref is not under refs/heads/ or refs/tags/ respectively"

[[item]]
id = "P13"
kind = "deliverable"
statement = "go-dt exports the union constraint GitRevisionTypes: GitRevision | GitObjectID | GitShortObjectID | GitRef | GitBranchName | GitTagName"

[[item]]
id = "P14"
kind = "deliverable"
statement = "GitBranchName's and GitTagName's doc comments warn that casting a short name to GitRevision can resolve to a different ref, and point to ToRef()"

[[item]]
id = "P15"
kind = "deliverable"
statement = "errors.go defines the seven type sentinels and fifteen new rule sentinels named in the plan, and every Parse, Validate and To* error wraps one type sentinel and one rule sentinel"
verify = "test/ module: each invalid table row asserts errors.Is for both its type sentinel and the sentinel of the rule it breaks"

[[item]]
id = "P16"
kind = "deliverable"
statement = "go-dt never runs git and its root go.mod gains no dependency"

[[item]]
id = "P17"
kind = "deliverable"
statement = "README documents the git types, the rules each follows, and the conversions"

[[item]]
id = "P18"
kind = "exclusion"
statement = "Does not parse the gitrevisions(7) grammar"

[[item]]
id = "P19"
kind = "exclusion"
statement = "Does not add a type for revision ranges (A..B, A...B, ^A)"

[[item]]
id = "P20"
kind = "exclusion"
statement = "Does not change go-gitutil; moving its GitRef and RemoteName onto these types belongs to go-gitutil's reshape task"

[[item]]
id = "P21"
kind = "exclusion"
statement = "Does not settle a naming convention for union constraints; that is decided in gomion"

[[item]]
id = "P22"
kind = "deliverable"
statement = "GitRef.ToBranchName and ToTagName also validate the short name they return, returning the ParseGitBranchName or ParseGitTagName error (for example ErrInvalidGitBranchName with ErrIsHEAD for refs/heads/HEAD), so a To* result is always a valid value"

[[item]]
id = "P23"
kind = "deliverable"
statement = "Each git sentinel in errors.go has its own one-line doc comment, citing the git-check-ref-format(1) rule where one applies, following Mike's EQ-287 decision on E-2567"
