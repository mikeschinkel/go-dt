[[item]]
id = "P1"
kind = "deliverable"
statement = "dtx/go.mod, appinfo/go.mod and dtglob/go.mod contain no replace directive"

[[item]]
id = "P2"
kind = "deliverable"
statement = "dtx, appinfo and dtglob each require go-dt v0.6.1 or a later published tag, with its checksums in that module's go.sum"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Each test or example module (test, dtx/test, appinfo/test, dtglob/test, examples/basic_usage) has exactly one replace directive, pointing at the module it tests"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Every go.mod in the repo is tidy as CI sees it: GOWORK=off go mod tidy -diff reports nothing in any module"

[[item]]
id = "P5"
kind = "deliverable"
statement = "go-dt has a justfile offering the Makefile's recipes, and the Makefile is gone"

[[item]]
id = "P6"
kind = "deliverable"
statement = "just work writes a go.work listing every module in the repo, found from the go.mod files present"

[[item]]
id = "P7"
kind = "deliverable"
statement = "README.md documents that local development needs a go.work, created by running just work"

[[item]]
id = "P8"
kind = "deliverable"
statement = "test.yml runs with GOWORK=off, tests root, test/, and each of dtx, appinfo and dtglob with its test module, and fails when any go.mod is not tidy"

[[item]]
id = "P9"
kind = "deliverable"
statement = "release.yml takes a module from a fixed choice (root, dtx, appinfo, dtglob) plus a version, and builds the tag itself: vX.Y.Z for root, <dir>/vX.Y.Z otherwise"

[[item]]
id = "P10"
kind = "deliverable"
statement = "release.yml refuses to tag when the chosen directory's go.mod does not declare github.com/mikeschinkel/go-dt or github.com/mikeschinkel/go-dt/<dir>, or contains a replace directive"

[[item]]
id = "P11"
kind = "deliverable"
statement = "release.yml tests the chosen module, and its test module, with GOWORK=off before tagging"

[[item]]
id = "P12"
kind = "deliverable"
statement = "Release notes for a nested module take the previous tag with the same prefix and list only commits touching its directory; root notes take the previous unprefixed tag and omit commits touching only nested modules"

[[item]]
id = "P13"
kind = "deliverable"
statement = "The GitHub release title names the module being released"

[[item]]
id = "P14"
kind = "deliverable"
statement = "Before the user runs the workflow, the user is given for each of dtx, appinfo and dtglob the proposed tag, its Go Stability reason (patch or minor, from comparing exported API against the last tag) and a release description"

[[item]]
id = "P15"
kind = "deliverable"
statement = "gomion E-2434, E-2212 and E-2347 and endless E-2433 each carry an open question on using go.work, with no replace in publishable modules, in place of removing and restoring replaces, citing this task's findings"

