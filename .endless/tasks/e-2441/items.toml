[[item]]
id = "P1"
kind = "deliverable"
statement = "just propose <module> takes root, dtx, appinfo or dtglob and compares the module's exported API at its previous tag (same prefix rule as release.yml) with HEAD"

[[item]]
id = "P2"
kind = "deliverable"
statement = "just propose prints the API changes and a verdict under 0.X.Y: any incompatible change proposes v0.(Y+1).0, otherwise v0.Y.(Z+1), with the full tag"

[[item]]
id = "P3"
kind = "deliverable"
statement = "just propose builds the previous tag from the whole repo at that tag, extracted to a temp directory that is removed afterwards"

[[item]]
id = "P4"
kind = "deliverable"
statement = "just propose runs apidiff as go run golang.org/x/exp/cmd/apidiff@<pinned version> with GOWORK=off; no go.mod gains a requirement"

[[item]]
id = "P5"
kind = "deliverable"
statement = "just propose warns when the module's go-dt require differs in X (of 0.X.Y) between the previous tag and HEAD, and the warning does not change the verdict"

[[item]]
id = "P6"
kind = "deliverable"
statement = "just propose reports a module with no previous tag and gives no verdict"

[[item]]
id = "P7"
kind = "deliverable"
statement = "just floors [dir] (default ..) lists every go.mod under dir that requires go-dt, dtx, appinfo or dtglob, with the version required, skipping .endless/worktrees, vendor and .git"

[[item]]
id = "P8"
kind = "deliverable"
statement = "just floors labels each required version published (listed by go list -m -versions), tagged-not-resolvable (absent from the proxy but tagged on the go-dt remote) or never-tagged, and exits non-zero when any is not published"

[[item]]
id = "P9"
kind = "deliverable"
statement = "just release <module> <version> [description] refuses when the worktree is dirty or HEAD differs from origin/main after a fetch, naming the reason, without calling gh"

[[item]]
id = "P10"
kind = "deliverable"
statement = "just release prints the tag and commit the workflow will tag, runs gh workflow run release.yml with the module, version and description inputs, and prints the run URL"

[[item]]
id = "P11"
kind = "deliverable"
statement = "The recipes' logic lives in scripts/propose.sh, scripts/floors.sh and scripts/release.sh, and shellcheck reports nothing on them"

[[item]]
id = "P12"
kind = "deliverable"
statement = "README's Local Development section documents propose, floors and release, and AGENTS.md mentions propose and floors"

[[item]]
id = "P13"
kind = "deliverable"
statement = "E-2441's verify suite is a verify.sh that sources _harness.sh and exercises propose, floors and release's refusals, with a stub gh"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not run just release or make any tag; the user releases"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not change release.yml or test.yml"

[[item]]
